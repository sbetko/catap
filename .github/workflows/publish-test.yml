name: Publish (TestPyPI)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build distributions
    runs-on: macos-26
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Install dependencies
        run: uv sync --group dev

      - name: Build distributions
        run: uv run --group dev python -m build

      - name: Verify metadata
        run: uv run --group dev twine check dist/*

      - name: Verify installed wheel
        run: |
          uv venv --python 3.12 --seed /tmp/catap-wheel-check
          /tmp/catap-wheel-check/bin/pip install --quiet dist/*.whl
          /tmp/catap-wheel-check/bin/python - <<'PY'
          import pathlib
          import tomllib

          import catap
          from catap._native_coreaudio import load_native_coreaudio

          pyproject = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          expected_version = pyproject["project"]["version"]
          assert catap.__version__ == expected_version, (
              catap.__version__,
              expected_version,
          )
          library = load_native_coreaudio()
          print("native dylib:", library.path, "ABI", library.abi_version())
          PY
          /tmp/catap-wheel-check/bin/catap --help > /dev/null

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  publish-test:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    environment:
      name: testpypi
      url: https://test.pypi.org/p/catap

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
