name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  quality:
    name: Quality (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint
        run: uv run --group dev ruff check .

      - name: Type check
        run: uv run --group dev ty check --error-on-warning src tests

      - name: Test
        run: uv run --group dev pytest

  free-threaded:
    name: Free-threaded (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
        python-version: ["3.13t", "3.14t"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Install free-threaded Python
        run: uv python install ${{ matrix.python-version }}

      - name: Verify GIL remains disabled after imports
        run: |
          uv run --python ${{ matrix.python-version }} --group dev python - <<'PY'
          import sys
          import sysconfig

          assert sysconfig.get_config_var("Py_GIL_DISABLED") == 1
          assert sys._is_gil_enabled() is False

          import catap
          import catap.recorder

          assert sys._is_gil_enabled() is False
          PY

      - name: Test
        run: uv run --python ${{ matrix.python-version }} --group dev pytest

  intel-slice:
    name: Intel slice (Rosetta, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rosetta 2
        run: sudo softwareupdate --install-rosetta --agree-to-license

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Install x86_64 Python
        run: uv python install cpython-3.12-macos-x86_64-none

      - name: Verify x86_64 interpreter
        run: |
          uv run --python cpython-3.12-macos-x86_64-none --group dev python -c \
            "import platform; assert platform.machine() == 'x86_64', platform.machine()"

      - name: Test under Rosetta
        run: uv run --python cpython-3.12-macos-x86_64-none --group dev pytest

  package:
    name: Build Package
    runs-on: macos-26
    needs: [quality, free-threaded, intel-slice]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Install dependencies
        run: uv sync --group dev

      - name: Build distributions
        run: uv run --group dev python -m build

      - name: Verify metadata
        run: uv run --group dev twine check dist/*

      - name: Verify installed wheel
        run: |
          uv venv --python 3.12 --seed /tmp/catap-wheel-check
          /tmp/catap-wheel-check/bin/pip install --quiet dist/*.whl
          /tmp/catap-wheel-check/bin/python - <<'PY'
          import pathlib
          import tomllib

          import catap
          from catap._native_coreaudio import load_native_coreaudio

          pyproject = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          expected_version = pyproject["project"]["version"]
          assert catap.__version__ == expected_version, (
              catap.__version__,
              expected_version,
          )
          library = load_native_coreaudio()
          print("native dylib:", library.path, "ABI", library.abi_version())
          PY
          /tmp/catap-wheel-check/bin/catap --help > /dev/null

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
